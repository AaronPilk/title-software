name: Security readiness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TITLE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/title-scanner/package-lock.json
            services/title-scanner-host/package-lock.json
      - name: Install locked dependencies and isolated database tools
        run: |
          npm ci --prefix web
          npm ci --prefix services/title-scanner
          npm ci --prefix services/title-scanner-host
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          cd web && npx playwright install --with-deps chromium
      - name: Production dependency advisories
        run: |
          npm audit --prefix web --omit=dev --audit-level=high
          npm audit --prefix services/title-scanner --omit=dev --audit-level=high
          npm audit --prefix services/title-scanner-host --omit=dev --audit-level=high
      - name: Types and lint
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix services/title-scanner-host run typecheck
      - name: Synthetic domain, API and security regressions
        run: |
          npm --prefix web test
          npm --prefix web run test:backend
          npm --prefix web run test:api
          npm --prefix web run test:security
          npm --prefix web run test:security:sql
          npm --prefix web run test:scanner
          npm --prefix web run test:recovery
          npm --prefix services/title-scanner-host test
          npm --prefix services/title-backups test
      - name: Application upload and reviewed autofill regressions
        run: |
          npm --prefix web run test:jv
          npm --prefix web run test:jv:portal
          npm --prefix web run test:company-status
          npm --prefix web run test:workspace:views
          npm --prefix web run test:daily-use:ui
      - name: Production email and document boundaries
        run: |
          npm --prefix web run test:missive
          npm --prefix web run test:missive:sql
          npm --prefix web run test:missive:ui
          npm --prefix web run test:document-allocation
      - name: Package the Edge functions
        run: npm --prefix web run backend:build
      # This workflow deliberately has no cloud credentials or deployment job.
      # Tests start temporary local PostgreSQL clusters and use fictional records.
